[pytest]
testpaths = .
python_files = test_*.py
addopts = -v -ra --strict-markers --tb=short
markers =
    smoke: checks that do not require an account
    auth: login, role access and logout
    planning: budget proposal, finance review and chancellor approval
    procurement: purchase requests, canvass and purchase orders
    signature: signature permissions and cross-role handoff
    receiving: delivery receipt validation and persistence
    admin: user creation, editing and account deactivation
    reports: fiscal-year and report correctness
    notifications: notification navigation and read state
    e2e: cross-role workflow in one browser test
    mutating: writes explicitly configured disposable test data
